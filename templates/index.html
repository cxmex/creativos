<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creativos — Fundastock</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0F0F23; color: #fff; font-family: -apple-system, sans-serif; min-height: 100vh; }

/* Header */
.header { background: #16213E; padding: 14px 20px; border-bottom: 1px solid #1e2a4a; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.header-title { font-size: 1.05rem; font-weight: 800; letter-spacing: .02em; }
.badge { background: #7C4DFF; color: #fff; font-size: .68rem; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
.search-wrap { flex: 1; min-width: 180px; max-width: 320px; }
.search-wrap input { width: 100%; background: #0d1526; border: 1px solid #2a3a5e; border-radius: 8px; padding: 7px 12px; color: #fff; font-size: .85rem; outline: none; }
.search-wrap input::placeholder { color: #555; }
.search-wrap input:focus { border-color: #7C4DFF; }

/* Sort bar */
.sort-bar { background: #0d1526; padding: 10px 20px; border-bottom: 1px solid #1a1a35; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sort-label { font-size: .68rem; color: #555; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.toggle { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid #2a3a5e; }
.tbtn { background: #16213E; color: #666; border: none; padding: 6px 13px; font-size: .78rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: .12s; }
.tbtn.active { background: #7C4DFF; color: #fff; }
.tbtn.active-green { background: #00C853; color: #0F0F23; }
.spacer { flex: 1; }
.stats-bar { font-size: .75rem; color: #555; }
.stats-bar strong { color: #888; }

/* Main */
.main { padding: 16px 20px; }

/* Estilo card */
.estilo-card { background: #16213E; border: 1px solid #1e2a4a; border-radius: 12px; margin-bottom: 10px; overflow: hidden; transition: border-color .15s; }
.estilo-card:hover { border-color: #2a3a5e; }
.estilo-card.expanded { border-color: #7C4DFF44; }
.estilo-header { display: flex; align-items: center; gap: 14px; padding: 12px 16px; cursor: pointer; user-select: none; }
.estilo-thumb { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; background: #0d1526; flex-shrink: 0; border: 1px solid #2a3a5e; }
.estilo-thumb-placeholder { width: 64px; height: 64px; border-radius: 8px; background: #0d1526; border: 1px solid #1e2a4a; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #2a3a5e; }
.estilo-info { flex: 1; min-width: 0; }
.estilo-name { font-size: .88rem; font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.estilo-sub { font-size: .7rem; color: #555; margin-top: 3px; }
.estilo-stocks { display: flex; gap: 10px; align-items: center; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.stock-chip { text-align: center; min-width: 44px; }
.stock-chip-val { font-size: 1.05rem; font-weight: 800; line-height: 1; }
.stock-chip-lbl { font-size: .6rem; color: #555; text-transform: uppercase; margin-top: 2px; }
.expand-icon { color: #555; font-size: .85rem; margin-left: 6px; transition: transform .2s; flex-shrink: 0; }
.expanded .expand-icon { transform: rotate(180deg); color: #7C4DFF; }

/* Lightbox */
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 3000; display: none; align-items: center; justify-content: center; }
#lightbox.show { display: flex; }
#lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 10px; object-fit: contain; }
#lightbox-close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 2rem; cursor: pointer; line-height: 1; }

/* Creativos strip (inside expanded color tree) */
.creativos-strip { background: #0a0a1a; border-bottom: 1px solid #2a3a5e; padding: 10px 16px 12px; }
.creativos-label { font-size: .6rem; color: #7C4DFF; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
.creativos-photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.creativos-photos::-webkit-scrollbar { height: 3px; }
.creativos-photos::-webkit-scrollbar-thumb { background: #7C4DFF55; border-radius: 2px; }
.creativo-item { flex-shrink: 0; cursor: pointer; position: relative; }
.creativo-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #7C4DFF66; display: block; transition: transform .15s; }
.creativo-item img:hover { transform: scale(1.05); border-color: #7C4DFF; }

/* Upload modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-box { background: #16213E; border: 1px solid #2a3a5e; border-radius: 14px; padding: 24px; max-width: 360px; width: 100%; }
.modal-title { font-size: .95rem; font-weight: 800; margin-bottom: 4px; }
.modal-sub { font-size: .75rem; color: #7C4DFF; margin-bottom: 12px; }
.tipo-row { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid #2a3a5e; margin-bottom: 14px; }
.tipo-btn { flex: 1; background: #0d1526; color: #555; border: none; padding: 8px; font-size: .8rem; font-weight: 700; cursor: pointer; transition: .12s; }
.tipo-btn.active { background: #7C4DFF; color: #fff; }
.file-drop { border: 2px dashed #2a3a5e; border-radius: 10px; padding: 24px; text-align: center; cursor: pointer; transition: border-color .15s; margin-bottom: 12px; }
.file-drop:hover, .file-drop.drag-over { border-color: #7C4DFF; }
.file-drop input { display: none; }
.file-drop-label { font-size: .82rem; color: #888; }
.file-drop-name { font-size: .78rem; color: #00C853; margin-top: 6px; font-weight: 700; }
#upload-preview img, #upload-preview video { max-width: 100%; max-height: 180px; border-radius: 8px; margin-top: 10px; display: block; }
.btn-upload { background: #7C4DFF; color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: .85rem; font-weight: 700; cursor: pointer; }
.btn-upload:disabled { opacity: .5; cursor: not-allowed; }
.btn-cancel { background: transparent; color: #666; border: 1px solid #2a3a5e; border-radius: 8px; padding: 10px 18px; font-size: .85rem; cursor: pointer; }
.upload-status { margin-top: 10px; font-size: .78rem; min-height: 18px; }
.upload-status.ok { color: #00C853; }
.upload-status.err { color: #ff4444; }

/* Estilo thumb wrap — holds thumb + upload button */
.estilo-thumb-wrap { position: relative; flex-shrink: 0; }
.estilo-upload-btn { position: absolute; bottom: -4px; right: -4px; width: 20px; height: 20px; background: #7C4DFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; line-height: 1; cursor: pointer; border: 2px solid #16213E; opacity: 0; transition: opacity .15s; z-index: 1; }
.estilo-card:hover .estilo-upload-btn { opacity: 1; }

/* Color tree */
.color-tree { border-top: 1px solid #1a1a35; background: #0d1526; display: none; }
.expanded .color-tree { display: block; }
.color-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid #12121f; transition: background .1s; }
.color-row:last-child { border-bottom: none; }
.color-row:hover { background: #16213E44; }
/* Per-color photo cell */
.color-photo-wrap { position: relative; flex-shrink: 0; width: 52px; height: 52px; }
.color-photo-ph { width: 52px; height: 52px; border-radius: 6px; background: #1a1a35; border: 1px solid #1e2a4a; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.color-photo-ph img { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; border: 1px solid #2a3a5e; display: block; cursor: pointer; }
.color-swatch { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(255,255,255,.1); }
.color-upload-btn { position: absolute; bottom: -4px; right: -4px; width: 18px; height: 18px; background: #7C4DFF; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; border: 2px solid #0d1526; opacity: 0; transition: opacity .15s; z-index: 1; }
.color-row:hover .color-upload-btn { opacity: 1; }
.color-name { flex: 1; font-size: .78rem; color: #ccc; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.color-name { flex: 1; font-size: .78rem; color: #ccc; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.color-stocks { display: flex; gap: 14px; align-items: center; flex-shrink: 0; }
.color-stock-item { text-align: right; min-width: 34px; }
.color-stock-val { font-size: .85rem; font-weight: 700; }
.color-stock-lbl { font-size: .58rem; color: #555; text-transform: uppercase; }
.color-bar-wrap { width: 60px; height: 4px; background: #1a1a35; border-radius: 2px; overflow: hidden; }
.color-bar { height: 100%; border-radius: 2px; background: #7C4DFF; }

/* Rank badge */
.rank-badge { font-size: .65rem; color: #555; font-weight: 700; min-width: 28px; text-align: right; }

/* Loading / empty */
#loading { text-align: center; padding: 60px; color: #7C4DFF; font-size: .9rem; }
#empty { text-align: center; padding: 60px; color: #555; font-size: .9rem; display: none; }

/* Ventas mode badge */
.ventas-badge { display: inline-block; background: #00C853; color: #0F0F23; font-size: .62rem; padding: 1px 6px; border-radius: 6px; font-weight: 800; margin-left: 6px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">Creativos</div>
  <span class="badge">Fundastock</span>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="Buscar estilo..." oninput="filterEstilos()">
  </div>
</div>

<div class="sort-bar">
  <span class="sort-label">Ordenar</span>
  <div class="toggle">
    <button class="tbtn active" id="s-nombre" onclick="setSort('nombre')">A-Z</button>
    <button class="tbtn" id="s-stock_total" onclick="setSort('stock_total')">Stock Total</button>
    <button class="tbtn" id="s-stock_t1" onclick="setSort('stock_t1')">T1</button>
    <button class="tbtn" id="s-stock_t2" onclick="setSort('stock_t2')">T2</button>
    <button class="tbtn" id="s-colores" onclick="setSort('colores')">+ Colores</button>
    <button class="tbtn" id="s-ventas" onclick="setSort('ventas')">Ventas 30d</button>
  </div>
  <div class="spacer"></div>
  <div class="stats-bar" id="stats-bar"></div>
</div>

<div class="main">
  <div id="loading">Cargando estilos...</div>
  <div id="empty">Sin resultados</div>
  <div id="list"></div>
</div>

<script>
let allEstilos = [];
let thumbs = {};
let ventasMap = {};
let currentSort = 'nombre';
let ventasLoaded = false;

const COLOR_HEX = {
  'NEGRO': '#222', 'BLANCO': '#f5f5f5', 'NARANJA': '#FF6B00',
  'ROJO': '#e53935', 'AZUL': '#1565C0', 'VERDE': '#00C853',
  'ROSA': '#E91E63', 'MORADO': '#7C4DFF', 'AMARILLO': '#FFD600',
  'CAFE': '#6D4C41', 'GRIS': '#607D8B', 'DORADO': '#FFD700',
  'PLATEADO': '#9E9E9E', 'CELESTE': '#29B6F6', 'TURQUESA': '#00BCD4',
  'LILA': '#CE93D8', 'BEIGE': '#EFEBE9', 'GUINDA': '#880E4F',
  'HUMO': '#78909C', 'TRANSPARENTE': 'rgba(200,200,255,0.15)',
  'VERDE MILITAR': '#558B2F', 'AZUL MARINO': '#0D47A1',
  'ROSA MEXICANO': '#E91E63', 'SALMON': '#FF8A65', 'COBRE': '#BF360C',
  'SIN COLOR': '#2a2a2a',
};

function swatchColor(name) {
  const upper = name.toUpperCase();
  // Try exact match first
  if (COLOR_HEX[upper]) return COLOR_HEX[upper];
  // Try partial match
  for (const [key, val] of Object.entries(COLOR_HEX)) {
    if (upper.includes(key)) return val;
  }
  return '#333';
}

async function load() {
  // Load estilos first — render immediately without waiting for thumbs
  allEstilos = await fetch(`/api/estilos?sort=${currentSort}`).then(r => r.json());
  document.getElementById('loading').style.display = 'none';
  updateStats();
  filterEstilos();

  // Load thumbs in background — inject into already-rendered cards
  fetch('/api/thumbs').then(r => r.json()).then(data => {
    thumbs = data;
    Object.entries(thumbs).forEach(([id, url]) => {
      const img = document.querySelector(`#card-${id} .estilo-thumb`);
      if (img) { img.src = url; img.style.display = ''; }
      const ph = document.querySelector(`#card-${id} .estilo-thumb-placeholder`);
      if (ph) ph.style.display = 'none';
    });
  }).catch(() => {});
}

async function loadVentas() {
  if (ventasLoaded) return;
  document.getElementById('s-ventas').textContent = '...';
  try {
    ventasMap = await fetch('/api/ventas-por-estilo?dias=30').then(r => r.json());
    ventasLoaded = true;
    document.getElementById('s-ventas').textContent = 'Ventas 30d';
  } catch(e) {
    document.getElementById('s-ventas').textContent = 'Ventas 30d';
  }
}

function sortedEstilos(rows) {
  if (currentSort === 'ventas') {
    return [...rows].sort((a, b) => (ventasMap[b.id] || 0) - (ventasMap[a.id] || 0));
  }
  return rows; // already sorted by server for other sorts
}

function setSort(s) {
  currentSort = s;
  Object.keys({ nombre:1, stock_total:1, stock_t1:1, stock_t2:1, colores:1, ventas:1 })
    .forEach(k => {
      const el = document.getElementById(`s-${k}`);
      if (el) el.classList.remove('active', 'active-green');
    });
  const btn = document.getElementById(`s-${s}`);
  if (btn) btn.classList.add(s === 'ventas' ? 'active-green' : 'active');

  if (s === 'ventas') {
    loadVentas().then(() => filterEstilos());
  } else {
    fetch(`/api/estilos?sort=${s}`).then(r => r.json()).then(data => {
      allEstilos = data;
      filterEstilos();
    });
  }
}

function filterEstilos() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  let rows = allEstilos.filter(e => !q || e.nombre.toLowerCase().includes(q));
  rows = sortedEstilos(rows);
  updateStats(rows);
  render(rows);
}

function updateStats(rows) {
  const data = rows || allEstilos;
  const totalEstilos = data.length;
  const totalStock = data.reduce((s, e) => s + e.total, 0);
  document.getElementById('stats-bar').innerHTML =
    `<strong>${totalEstilos}</strong> estilos · <strong>${totalStock.toLocaleString()}</strong> piezas`;
}

function render(rows) {
  if (!rows.length) {
    document.getElementById('empty').style.display = '';
    document.getElementById('list').innerHTML = '';
    return;
  }
  document.getElementById('empty').style.display = 'none';

  const maxTotal = Math.max(...rows.map(e => e.total), 1);

  document.getElementById('list').innerHTML = rows.map((e, idx) => {
    const imgUrl = thumbs[String(e.id)];
    const imgEl = `<img class="estilo-thumb" src="${imgUrl || ''}" alt="" loading="lazy" style="${imgUrl ? '' : 'display:none'}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`;
    const placeholder = `<div class="estilo-thumb-placeholder" style="${imgUrl ? 'display:none' : ''}">&#9749;</div>`;
    const rankLabel = currentSort === 'ventas'
      ? `<span class="ventas-badge">${(ventasMap[e.id] || 0)} vtas</span>`
      : '';

    const t1Color = e.t1 > 0 ? '#00C853' : '#333';
    const t2Color = e.t2 > 0 ? '#7C4DFF' : '#333';
    const totalColor = e.total > 0 ? '#fff' : '#333';

    const colorRows = e.colors.map(c => {
      const barPct = e.total > 0 ? Math.round((c.total / e.total) * 100) : 0;
      const swatch = swatchColor(c.color);
      const cid = c.color_id;
      const photoId = `cph-${e.id}-${cid || c.color.replace(/\s+/g,'-')}`;
      const colorLabel = c.color.replace(/'/g, "\\'");
      const uploadClick = cid
        ? `openUpload(event,${e.id},${cid},'${colorLabel}','${e.nombre.replace(/'/g,"\\'")}')`
        : `openUpload(event,${e.id},null,'${colorLabel}','${e.nombre.replace(/'/g,"\\'")}')`;
      return `<div class="color-row">
        <div class="color-photo-wrap">
          <div class="color-photo-ph" id="${photoId}" onclick="${uploadClick}">
            <div class="color-swatch" style="background:${swatch}"></div>
          </div>
          <div class="color-upload-btn" onclick="${uploadClick}">+</div>
        </div>
        <div class="color-name">${c.color}</div>
        <div class="color-bar-wrap"><div class="color-bar" style="width:${barPct}%"></div></div>
        <div class="color-stocks">
          <div class="color-stock-item">
            <div class="color-stock-val" style="color:#00C853">${c.t1}</div>
            <div class="color-stock-lbl">T1</div>
          </div>
          <div class="color-stock-item">
            <div class="color-stock-val" style="color:#7C4DFF">${c.t2}</div>
            <div class="color-stock-lbl">T2</div>
          </div>
          <div class="color-stock-item">
            <div class="color-stock-val" style="color:#fff">${c.total}</div>
            <div class="color-stock-lbl">Total</div>
          </div>
        </div>
      </div>`;
    }).join('');

    return `<div class="estilo-card" id="card-${e.id}">
      <div class="estilo-header" onclick="toggle(${e.id})">
        <div class="estilo-thumb-wrap">
          ${imgEl}${placeholder}
          <div class="estilo-upload-btn" onclick="event.stopPropagation();openEstiloUpload(${e.id},'${e.nombre.replace(/'/g,"\\'")}')">+</div>
        </div>
        <div class="estilo-info">
          <div class="estilo-name">${e.nombre}${rankLabel}</div>
          <div class="estilo-sub">${e.num_colors} color${e.num_colors !== 1 ? 'es' : ''} · ${e.proveedor || ''}</div>
        </div>
        <div class="estilo-stocks">
          <div class="stock-chip">
            <div class="stock-chip-val" style="color:${t1Color}">${e.t1}</div>
            <div class="stock-chip-lbl">T1</div>
          </div>
          <div class="stock-chip">
            <div class="stock-chip-val" style="color:${t2Color}">${e.t2}</div>
            <div class="stock-chip-lbl">T2</div>
          </div>
          <div class="stock-chip">
            <div class="stock-chip-val" style="color:${totalColor}">${e.total}</div>
            <div class="stock-chip-lbl">Total</div>
          </div>
        </div>
        <div class="expand-icon">&#9660;</div>
      </div>
      <div class="color-tree">
        ${colorRows || '<div style="padding:12px 24px;color:#555;font-size:.78rem">Sin stock en sistema</div>'}
      </div>
    </div>`;
  }).join('');
}

const loadedColorImages = new Set();

function openLightbox(url) {
  document.getElementById('lb-img').src = url;
  document.getElementById('lightbox').classList.add('show');
}

function toggle(id) {
  const card = document.getElementById(`card-${id}`);
  const wasExpanded = card.classList.contains('expanded');
  card.classList.toggle('expanded');

  if (!wasExpanded && !loadedColorImages.has(id)) {
    loadedColorImages.add(id);
    fetch(`/api/color-images/${id}`).then(r => r.json()).then(colorData => {
      // colorData: { "folder_name": { fotos: [...], creativos: [...] } }
      const estilo = allEstilos.find(e => e.id === id);
      if (!estilo) return;

      // 1. Inject first foto inline into each color row placeholder
      estilo.colors.forEach(c => {
        const sanitized = _sanitizeColorFolder(c.color);
        const info = (c.color_id && colorData[String(c.color_id)])
          || colorData[sanitized]
          || colorData[c.color.toUpperCase()]
          || {};
        const fotos = info.fotos || [];
        if (!fotos.length) return;
        const phId = c.color_id
          ? `cph-${id}-${c.color_id}`
          : `cph-${id}-${c.color.replace(/\s+/g,'-')}`;
        const ph = document.getElementById(phId);
        if (!ph) return;
        const url = fotos[0];
        ph.innerHTML = `<img src="${url}" alt="${c.color}" loading="lazy" onclick="event.stopPropagation();openLightbox('${url}')" onerror="this.style.display='none'">`;
      });

      // 2. Show all creativos as a strip at the top of the color tree
      const allCreativos = Object.values(colorData).flatMap(d => d.creativos || []);
      if (allCreativos.length) {
        const tree = document.querySelector(`#card-${id} .color-tree`);
        if (tree && !tree.querySelector('.creativos-strip')) {
          const strip = document.createElement('div');
          strip.className = 'creativos-strip';
          strip.innerHTML = '<div class="creativos-label">Creativos</div><div class="creativos-photos">'
            + allCreativos.map(url =>
                `<div class="creativo-item" onclick="openLightbox('${url}')"><img src="${url}" loading="lazy"></div>`
              ).join('')
            + '</div>';
          tree.insertBefore(strip, tree.firstChild);
        }
      }
    }).catch(() => {});
  }
}

/* ---- Upload ---- */
let _uploadCtx = null;
let _uploadTipo = 'foto';

function setTipo(t) {
  _uploadTipo = t;
  document.getElementById('tipo-btn-foto').classList.toggle('active', t === 'foto');
  document.getElementById('tipo-btn-creativo').classList.toggle('active', t === 'creativo');
}

function _sanitizeColorFolder(name) {
  return name.toUpperCase().trim().replace(/\s+/g,'_').replace(/\//g,'_');
}

function openUpload(evt, estiloId, colorId, colorName, estiloNombre) {
  evt.stopPropagation();
  const photoId = colorId
    ? `cph-${estiloId}-${colorId}`
    : `cph-${estiloId}-${colorName.replace(/\s+/g,'-')}`;
  _uploadCtx = { estiloId, colorId, colorName, estiloNombre, photoId, isEstilo: false };
  document.getElementById('modal-title').textContent = 'Subir foto de color';
  document.getElementById('modal-sub').textContent = `${estiloNombre} · ${colorName}`;
  document.getElementById('upload-input').disabled = false;
  document.getElementById('do-upload-btn').disabled = false;
  document.getElementById('upload-preview').innerHTML = '';
  document.getElementById('upload-status').textContent = '';
  document.getElementById('upload-filename').textContent = '';
  setTipo('foto');
  document.getElementById('tipo-row').style.display = 'flex';
  document.getElementById('upload-modal').style.display = 'flex';
}

function openEstiloUpload(estiloId, estiloNombre) {
  _uploadCtx = { estiloId, colorId: null, estiloNombre, isEstilo: true };
  document.getElementById('modal-title').textContent = `Subir foto de estilo`;
  document.getElementById('modal-sub').textContent = estiloNombre;
  document.getElementById('upload-input').disabled = false;
  document.getElementById('do-upload-btn').disabled = false;
  document.getElementById('upload-preview').innerHTML = '';
  document.getElementById('upload-status').textContent = '';
  document.getElementById('upload-filename').textContent = '';
  setTipo('foto');
  document.getElementById('tipo-row').style.display = 'none'; // estilo upload has no tipo choice
  document.getElementById('upload-modal').style.display = 'flex';
}

function closeUpload(evt) {
  if (evt && evt.target !== document.getElementById('upload-modal')) return;
  document.getElementById('upload-modal').style.display = 'none';
  document.getElementById('upload-input').value = '';
}

document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('upload-input');
  inp.addEventListener('change', () => {
    const f = inp.files[0];
    if (!f) return;
    document.getElementById('upload-filename').textContent = f.name;
    const prev = document.getElementById('upload-preview');
    const url = URL.createObjectURL(f);
    if (f.type.startsWith('video/')) {
      prev.innerHTML = `<video src="${url}" controls style="max-width:100%;max-height:180px;border-radius:8px;margin-top:10px"></video>`;
    } else {
      prev.innerHTML = `<img src="${url}" style="max-width:100%;max-height:180px;border-radius:8px;margin-top:10px">`;
    }
  });
});

async function doUpload() {
  const inp = document.getElementById('upload-input');
  const statusEl = document.getElementById('upload-status');
  const btn = document.getElementById('do-upload-btn');
  if (!inp.files[0]) { statusEl.textContent = 'Selecciona un archivo'; statusEl.className = 'upload-status err'; return; }
  btn.disabled = true;
  statusEl.className = 'upload-status';
  statusEl.textContent = 'Subiendo...';

  const fd = new FormData();
  fd.append('file', inp.files[0]);

  const { estiloId, colorId, colorName, photoId, isEstilo } = _uploadCtx;
  let endpoint;
  if (isEstilo) {
    endpoint = `/api/upload/estilo/${estiloId}`;
  } else {
    fd.append('color_name', colorName);
    if (colorId) fd.append('color_id', colorId);
    fd.append('tipo', _uploadTipo);
    endpoint = `/api/upload/color/${estiloId}`;
  }

  try {
    const res = await fetch(endpoint, { method: 'POST', body: fd });
    const data = await res.json();
    if (data.ok) {
      statusEl.className = 'upload-status ok';
      statusEl.textContent = 'Subido correctamente';
      if (!isEstilo && data.url) {
        if (_uploadTipo === 'creativo') {
          // Append to creativos strip if already rendered
          let strip = document.querySelector(`#card-${estiloId} .creativos-photos`);
          if (!strip) {
            // Create the strip
            const tree = document.querySelector(`#card-${estiloId} .color-tree`);
            if (tree) {
              const s = document.createElement('div');
              s.className = 'creativos-strip';
              s.innerHTML = '<div class="creativos-label">Creativos</div><div class="creativos-photos"></div>';
              tree.insertBefore(s, tree.firstChild);
              strip = s.querySelector('.creativos-photos');
            }
          }
          if (strip) {
            const item = document.createElement('div');
            item.className = 'creativo-item';
            item.onclick = () => openLightbox(data.url);
            item.innerHTML = `<img src="${data.url}" loading="lazy">`;
            strip.appendChild(item);
          }
        } else if (photoId) {
          const ph = document.getElementById(photoId);
          if (ph) ph.innerHTML = `<img src="${data.url}" loading="lazy" onclick="event.stopPropagation();openLightbox('${data.url}')" style="width:52px;height:52px;border-radius:6px;object-fit:cover;display:block;cursor:pointer">`;
        }
      } else if (isEstilo && data.url) {
        // Refresh estilo thumb
        const thumbEl = document.querySelector(`#card-${estiloId} .estilo-thumb`);
        if (thumbEl) { thumbEl.src = data.url + '?t=' + Date.now(); thumbEl.style.display = ''; }
      }
      setTimeout(() => { document.getElementById('upload-modal').style.display = 'none'; }, 1200);
    } else {
      statusEl.className = 'upload-status err';
      statusEl.textContent = data.error || 'Error al subir';
      btn.disabled = false;
    }
  } catch(e) {
    statusEl.className = 'upload-status err';
    statusEl.textContent = 'Error de red';
    btn.disabled = false;
  }
}

load();
</script>

<div id="lightbox" onclick="this.classList.remove('show')">
  <span id="lightbox-close" onclick="document.getElementById('lightbox').classList.remove('show')">&times;</span>
  <img id="lb-img" src="" alt="">
</div>

<div id="upload-modal" class="modal-overlay" style="display:none" onclick="closeUpload(event)">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">Subir archivo</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="tipo-row" id="tipo-row">
      <button class="tipo-btn active" id="tipo-btn-foto" onclick="setTipo('foto')">Foto del color</button>
      <button class="tipo-btn" id="tipo-btn-creativo" onclick="setTipo('creativo')">Creativo</button>
    </div>
    <div class="file-drop" onclick="document.getElementById('upload-input').click()">
      <input type="file" id="upload-input" accept="image/*,video/*">
      <div class="file-drop-label">Toca para seleccionar foto o video</div>
      <div class="file-drop-name" id="upload-filename"></div>
    </div>
    <div id="upload-preview"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn-upload" id="do-upload-btn" onclick="doUpload()">Subir</button>
      <button class="btn-cancel" onclick="document.getElementById('upload-modal').style.display='none'">Cancelar</button>
    </div>
    <div class="upload-status" id="upload-status"></div>
  </div>
</div>
</body>
</html>
